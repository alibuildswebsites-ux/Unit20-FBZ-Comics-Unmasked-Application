[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fbz-dataset-processing"
version = "1.0.0"
description = "Fantasy Bazaar dataset processing application for Unit 20"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/fbz"]

[tool.coverage.report]
show_missing = true
skip_covered = false
